<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>linx 运维控制台</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #181b22; --panel2: #1f232c; --line: #2a2f3a;
      --txt: #e6e9ef; --muted: #9aa3b2; --acc: #4f8cff; --ok: #3fb950; --err: #f85149; --warn: #d29922;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--txt); font-size: 14px; }
    a { color: var(--acc); }
    button { cursor: pointer; border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px;
      background: var(--acc); color: #fff; }
    button.ghost { background: var(--panel2); color: var(--txt); border: 1px solid var(--line); }
    button.danger { background: var(--err); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input, select { background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
      border-radius: 6px; padding: 7px 10px; font-size: 13px; width: 100%; }
    label { display: block; color: var(--muted); margin: 8px 0 4px; font-size: 12px; }
    .hidden { display: none !important; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 140px; }
    .mono { font-family: ui-monospace, Consolas, monospace; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
    .pill.ok { background: rgba(63,185,80,.15); color: var(--ok); }
    .pill.no { background: rgba(154,163,178,.15); color: var(--muted); }

    /* login */
    #login { display: flex; align-items: center; justify-content: center; height: 100vh; }
    #login .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 32px; width: 320px; }
    #login h1 { margin: 0 0 4px; font-size: 22px; }
    #login p { color: var(--muted); margin: 0 0 20px; font-size: 12px; }

    /* app */
    header { display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
    header h1 { font-size: 18px; margin: 0; }
    header .ver { color: var(--muted); font-size: 12px; margin-left: 8px; }
    nav { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
    nav button { background: none; color: var(--muted); border-radius: 0; border-bottom: 2px solid transparent; padding: 12px 16px; }
    nav button.active { color: var(--txt); border-bottom-color: var(--acc); }
    main { padding: 24px; max-width: 1000px; margin: 0 auto; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 20px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 14px; font-size: 15px; }
    .kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 16px; align-items: center; }
    .kv .k { color: var(--muted); }
    .kv .v { font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
    .proj { border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 10px; background: var(--panel2); }
    .proj .head { display: flex; justify-content: space-between; align-items: center; }
    .proj .name { font-weight: 600; }
    .proj .code { color: var(--muted); font-size: 12px; margin-left: 6px; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--panel2); border: 1px solid var(--line);
      padding: 12px 16px; border-radius: 8px; max-width: 360px; }
    .toast.ok { border-color: var(--ok); } .toast.err { border-color: var(--err); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; }
    .muted { color: var(--muted); }
    dialog { background: var(--panel); color: var(--txt); border: 1px solid var(--line); border-radius: 12px;
      padding: 24px; width: 520px; max-width: 92vw; }
    dialog::backdrop { background: rgba(0,0,0,.6); }
  </style>
</head>
<body>
  <!-- 登录 -->
  <div id="login">
    <div class="box">
      <h1>linx</h1>
      <p>现场内网出口代理 · 运维控制台</p>
      <label>运维口令</label>
      <input id="loginPw" type="password" placeholder="请输入口令" />
      <div id="loginErr" class="muted" style="color:var(--err);margin-top:8px;font-size:12px;"></div>
      <button style="width:100%;margin-top:16px;" onclick="doLogin()">登录</button>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app" class="hidden">
    <header>
      <div><h1>linx 运维控制台<span class="ver" id="ver"></span></h1></div>
      <button class="ghost" onclick="doLogout()">退出</button>
    </header>
    <nav>
      <button data-tab="overview" class="active" onclick="switchTab('overview')">连接信息</button>
      <button data-tab="projects" onclick="switchTab('projects')">项目配置</button>
      <button data-tab="status" onclick="switchTab('status')">服务状态</button>
      <button data-tab="security" onclick="switchTab('security')">安全设置</button>
    </nav>
    <main>
      <section id="tab-overview"></section>
      <section id="tab-projects" class="hidden"></section>
      <section id="tab-status" class="hidden"></section>
      <section id="tab-security" class="hidden"></section>
    </main>
  </div>

  <!-- 项目编辑弹窗 -->
  <dialog id="projDlg"></dialog>

  <script src="app.js"></script>
</body>
</html>
